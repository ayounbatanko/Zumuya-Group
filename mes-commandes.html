<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14213d"><title>Mes commandes — ZUMUYA GROUP</title><link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17243a;font-family:system-ui,Arial,sans-serif}
header{background:#14213d;color:#fff;padding:15px 20px;font-weight:800}header a{color:#fff;text-decoration:none}
main{max-width:1050px;margin:22px auto;padding:14px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
button{border:0;border-radius:9px;padding:10px 14px;background:#14213d;color:#fff;font-weight:700;cursor:pointer}
.card{background:#fff;border:1px solid #dfe6ee;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 6px 18px #14213d08}
.meta{color:#6b778b;font-size:13px}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.status{background:#edf1f6;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:800}
.timeline{display:flex;gap:5px;overflow:auto;margin:15px 0 5px;padding-bottom:5px}
.step{min-width:92px;flex:1;text-align:center;color:#8a95a5;font-size:11px}
.step i{display:block;width:22px;height:22px;margin:0 auto 5px;border-radius:50%;background:#e8edf3;line-height:22px;font-style:normal;font-weight:800}
.step.done{color:#087b4b}.step.done i{background:#d8f3e5;color:#087b4b}.step.current{color:#14213d;font-weight:800}.step.current i{background:#ffb703;color:#14213d}
.empty{text-align:center;padding:30px;color:#6b778b;background:#fff;border-radius:14px}
@media(max-width:600px){main{padding:9px}.card{padding:13px}.step{min-width:76px;font-size:10px}}
</style></head><body><header><a href="compte.html">ZUMUYA GROUP</a> · Mes commandes</header><main>
<div class="head"><div><h1>🛍️ Mes commandes</h1><p class="meta">Suivez vos commandes de la validation jusqu’à la livraison ou la réception.</p></div><button id="refresh">↻ Actualiser</button></div>
<div class="tools"><button data-filter="all">Toutes</button><button data-filter="restaurant">Restauration</button><button data-filter="market">Marketplace</button><button data-filter="agro">Approvisionnement</button></div>
<div id="orders"><div class="empty">Chargement de vos commandes…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="resto-db.js?v=4"></script><script src="resto-portal-bridge.js?v=4"></script>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(n||0))+' FCFA';let sb,uid,filter='all',rows=[];
const paths={
 restaurant:{steps:['Envoyée','Acceptée','Préparée','Récupérée','En route','Arrivée','Livrée'],states:['en attente','acceptée','préparée','colis récupéré','en route','arrivé','terminée']},
 market:{steps:['Envoyée','Confirmée','Expédiée','Livrée'],states:['pending','confirmed','shipped','delivered']},
 agro:{steps:['Envoyée','Confirmée','En livraison','Réceptionnée'],states:['pending','confirmed','delivering','received']}
};
function timeline(kind,status){const p=paths[kind],idx=p.states.indexOf(status),done=['cancelled','refused','annulée','refusée'].includes(status);if(done)return '<span class="status">Commande '+(status==='refused'||status==='refusée'?'refusée':'annulée')+'</span>';
 return '<div class="timeline">'+p.steps.map((x,i)=>'<div class="step '+(i<(idx<0?0:idx)?'done':i===(idx<0?0:idx)?'current':'')+'"><i>'+(i<(idx<0?0:idx)?'✓':i+1)+'</i>'+x+'</div>').join('')+'</div>'}
function draw(){const a=rows.filter(x=>filter==='all'||x.kind===filter).sort((a,b)=>b.ts-a.ts);$('#orders').innerHTML=a.map(x=>'<article class="card"><div class="head"><div><b>'+esc(x.org)+'</b><div class="meta">'+esc(x.ref)+' · '+new Date(x.ts).toLocaleString('fr-FR')+'</div></div><span class="status">'+esc(x.status)+'</span></div><p>'+esc(x.detail||'Commande enregistrée')+'</p><b>'+money(x.amount)+'</b>'+timeline(x.kind,x.status)+'</article>').join('')||'<div class="empty">Aucune commande pour cette catégorie.</div>'}
async function load(){try{const auth=await sb.auth.getSession();const session=auth.data.session;if(!session){location.replace('compte.html');return}uid=session.user.id;rows=[];
 const D=window.RGDB;if(D){const d=D.get(),u=(d.users||[]).find(x=>x.portalId===uid),rests=d.rests||[];
  (d.orders||[]).filter(o=>(u&&o.clientId===u.id)||o.clientAuthId===uid).forEach(o=>{const r=rests.find(x=>x.id===o.restId);rows.push({kind:'restaurant',ts:Number(o.created||Date.now()),ref:'#'+o.id,org:r?.name||'Restaurant partenaire',status:o.status||'en attente',amount:o.total,detail:(o.items||[]).map(i=>i.n+' × '+i.q).join(' · ')})})}
 const market=await sb.from('commerce_orders').select('id,order_number,status,subtotal,delivery_fee,currency,created_at,commerce_order_items(title,quantity)').eq('buyer_id',uid).order('created_at',{ascending:false}).limit(200);
 if(!market.error)(market.data||[]).forEach(o=>rows.push({kind:'market',ts:new Date(o.created_at).getTime(),ref:o.order_number||o.id,org:'Marketplace',status:o.status,amount:Number(o.subtotal||0)+Number(o.delivery_fee||0),detail:(o.commerce_order_items||[]).map(i=>i.title+' × '+i.quantity).join(' · ')}));
 const agro=await sb.from('rg_supply_orders').select('id,ref,status,total,currency_code,created_at,buyer_name').or('buyer_user_id.eq.'+uid+',placed_by.eq.'+uid).order('created_at',{ascending:false}).limit(200);
 if(!agro.error)(agro.data||[]).forEach(o=>rows.push({kind:'agro',ts:new Date(o.created_at).getTime(),ref:o.ref||o.id,org:'Approvisionnement · '+(o.buyer_name||'Compte'),status:o.status,amount:o.total,detail:'Commande auprès d’un fournisseur agricole'}));
 rows.sort((a,b)=>b.ts-a.ts);draw();
 }catch(e){$('#orders').innerHTML='<div class="empty">Impossible de charger les commandes. Vérifiez votre connexion et réessayez.</div>'}}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;draw()}));$('#refresh').addEventListener('click',load);load();
})();
</script><script src="account-shortcuts.js?v=1"></script></body></html>
