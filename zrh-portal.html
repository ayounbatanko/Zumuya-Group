<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>ZUMAYA GROUP — Gestion Restaurant & Hôtel</title>
<style>
:root{--navy:#14213d;--gold:#eab43f;--ink:#18233c;--muted:#6d7890;--line:#e5e9f0;--bg:#f4f6fa;--white:#fff;--red:#bd3c42}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
header{min-height:66px;background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{color:#fff;text-decoration:none;font-weight:900;letter-spacing:.5px}.brand b{color:var(--gold)}
.headright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.headright small{color:#d9dfeb}
button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#e9edf3;color:var(--navy);font-weight:700}
button.primary,.btn{background:var(--gold);color:#18233c}.logout{background:transparent;border:1px solid #73809b;color:#fff}
select{padding:9px;border:1px solid #dce2eb;border-radius:9px;background:#fff}
.layout{max-width:1500px;margin:0 auto;padding:18px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px}
aside,.main{min-width:0}.sidebox,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 5px 18px #14213d08}
.sidebox{position:sticky;top:14px}.sidebox h2{font-size:18px;margin:4px 0}.muted{color:var(--muted)}.tag{display:inline-block;border-radius:20px;padding:5px 9px;background:#eef2f7;color:#34415c;font-size:12px;font-weight:700}
#tabs{display:grid;gap:7px;margin-top:16px}#tabs button{text-align:left;background:#f0f3f7;padding:10px 11px}#tabs button.active{background:var(--navy);color:#fff}
.mainhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 14px}.mainhead h1{font-size:25px;margin:0}.mainhead small{color:var(--muted);font-weight:700;letter-spacing:.8px}
#notice{margin-bottom:12px;color:#bd3c42;font-weight:600}#content{min-width:0}
.panel{margin-bottom:14px}.panel h2,.panel h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.stat small{display:block;color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:6px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field,label{display:block;font-weight:650;color:#46516a;font-size:13px}.field input,.field select,.field textarea,label input,label select,label textarea{display:block;width:100%;padding:10px;border:1px solid #dce2eb;border-radius:9px;margin:6px 0 12px;background:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:160px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);text-transform:uppercase}.danger{background:#fae8e8;color:#9d2525}
@media(max-width:850px){.layout{grid-template-columns:1fr;padding:10px}.sidebox{position:static;padding:12px}.sidebox h2{font-size:16px}#tabs{display:flex;overflow-x:auto;padding-bottom:5px}#tabs button{white-space:nowrap;flex:0 0 auto;font-size:12px}.mainhead h1{font-size:21px}header{padding:12px}.headright{width:100%;justify-content:space-between}}
</style>
</head>
<body>
<header>
<a class="brand" href="index.html">ZUMAYA <b>GROUP</b></a>
<div class="headright"><small id="userLabel">Connexion…</small><span class="tag" id="kindLabel">PÔLE</span><select id="orgSelect" hidden aria-label="Choisir un établissement"></select><button id="logout" class="logout" type="button">Déconnexion</button></div>
</header>
<div class="layout">
<aside><div class="sidebox"><small class="muted">ESPACE PROFESSIONNEL</small><h2 id="orgName">Chargement de l’établissement…</h2><p id="orgMeta" class="muted"></p><div id="tabs" aria-label="Fonctionnalités"></div><p><a href="compte.html">← Retour à mon compte</a></p></div></aside>
<main class="main"><div class="mainhead"><div><small>ZUMAYA GROUP</small><h1>Gestion Restaurant & Hôtel</h1></div></div><div id="notice" role="status" aria-live="polite"></div><div id="content"><div class="panel">Chargement de votre espace…</div></div></main>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="zrh-native.js?v=2"></script>
</body></html>
