allowCredit:true,defThreshold:5,negStock:false,alertStock:true,footer:"Merci de votre visite !",rLogo:true,rCashier:true,rWidth:"80",autoPrint:true,requireLogin:true,lockMin:0,lastBackup:"",setup:false};
let uid=0,setTab="me",lockT;
const H=s=>{let h=5381;for(const c of "tb|"+s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
const ini=n=>n.trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase()||"?";
const mkUser=(name,role,pin="")=>({id:Date.now()+Math.floor(Math.random()*1e3),name,role,pin:pin?H(pin):"",color:"#c8df75",perms:structuredClone(ROLES[role]),prefs:{...DEF_PREFS}});
const curUser=()=>db.users.find(u=>u.id===uid)||db.users[0];
const can=k=>{let p=curUser().perms;return k==="settings"||(k in PAGES?p.pages.includes(k):!!p[k])};
const cur=()=>db.settings.currency,rd=n=>{let f=10**db.settings.decimals;return Math.round(n*f)/f};
const pv=n=>can("profit")?fmt(n):"•••";
function normalize(d){d.settings={...structuredClone(DEF_SETTINGS),...d.settings,requireLogin:true};if(!Array.isArray(d.users)||!d.users.length)d.users=[mkUser("Administrateur","admin")];
d.users.forEach(u=>{u.role=ROLES[u.role]?u.role:"cashier";u.prefs={...DEF_PREFS,...u.prefs};u.perms={...structuredClone(ROLES[u.role]),...u.perms}});
if(!d.users.some(u=>u.role==="admin")){d.users[0].role="admin";d.users[0].perms=structuredClone(ROLES.admin)}return d}
function applyPrefs(){let p=curUser().prefs,r=document.documentElement,c=PAL[p.palette]||PAL.foret,dark=p.theme==="dark"||(p.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
r.style.setProperty("--forest",c[0]);r.style.setProperty("--forest2",c[1]);r.style.setProperty("--lime",c[2]);r.style.setProperty("--pc",p.posCols);r.dataset.theme=dark?"dark":"light";
document.body.style.zoom=p.zoom;document.body.classList.toggle("compact",p.density==="compact");document.querySelector("meta[name=theme-color]").content=c[0]}
function applyBrand(){let s=db.settings;$("#brandName").textContent=(s.name||"Restaurant").toUpperCase();$("#brandLogo").innerHTML=s.logo?`<img src="${s.logo}">`:"RG";document.title=(s.name||"Restaurant")+" — Gestion"}
function refreshChip(){let u=curUser();$("#userChip").innerHTML=`<span class="avatar" style="background:${u.color};color:#102a25">${esc(ini(u.name))}</span><span>${esc(u.name)}</span>`}
function enter(u){uid=u.id;localStorage.setItem(UKEY,u.id);let w=$("#lockWrap");if(w)w.hidden=true;cart=[];applyPrefs();refreshChip();setPage(can(u.prefs.start)?u.prefs.start:ALLP.find(can)||"settings");armLock();let low=db.products.filter(p=>p.stock<=p.threshold).length;if(db.settings.alertStock&&low)setTimeout(()=>toast(low+" produit(s) à réapprovisionner."),700)}
function showLogin(cancel){let w=$("#lockWrap");if(!w){w=document.createElement("div");w.id="lockWrap";w.className="modal-wrap lock";document.body.appendChild(w)}w.hidden=false;
w.innerHTML=`<section class="modal" style="text-align:center"><div class="brand-logo" style="margin:0 auto 10px">${db.settings.logo?`<img src="${db.settings.logo}">`:"RG"}</div><h2 style="margin:0 0 4px">${esc(db.settings.name)}</h2><p class="hint">Qui utilise l'application ?</p><div class="users">${db.users.map(u=>`<button onclick="pickUser(${u.id})"><span class="avatar" style="background:${u.color};color:#102a25">${esc(ini(u.name))}</span><b>${esc(u.name)}</b><small>${ROLES[u.role].label}🔒</small></button>`).join("")}</div><div id="pinBox"></div>${cancel?`<button class="btn light" style="margin-top:12px" onclick="$('#lockWrap').hidden=true">Annuler</button>`:""}</section>`}
function pickUser(id){let u=db.users.find(x=>x.id===id);if(!u.pin)return enter(u);$("#pinBox").innerHTML=`<div class="form-group" style="margin-top:14px"><input id="loginPin" type="password" maxlength="30" placeholder="Mot de passe de ${esc(u.name)}" onkeydown="if(event.key==='Enter')checkPin(${id})"></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="checkPin(${id})">Entrer</button>`;$("#loginPin").focus()}
function checkPin(id){let u=db.users.find(x=>x.id===id);if(H($("#loginPin").value)===u.pin)enter(u);else{toast("Mot de passe incorrect.");$("#loginPin").value=""}}
function armLock(){clearTimeout(lockT);let m=+db.settings.lockMin;if(db.settings.requireLogin&&m>0)lockT=setTimeout(()=>showLogin(false),m*6e4)}
["pointerdown","keydown"].forEach(e=>addEventListener(e,armLock,true));
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>db&&applyPrefs());
function boot(){applyBrand();$("#userChip").onclick=openUserMenu;uid=db.users[0].id;applyPrefs();refreshChip();db.settings.setup?showLogin(false):showSetup()}
function showSetup(){let w=$("#lockWrap");if(!w){w=document.createElement("div");w.id="lockWrap";w.className="modal-wrap lock";document.body.appendChild(w)}w.hidden=false;let u=db.users[0];
w.innerHTML=`<section class="modal"><div class="brand-logo" style="margin:0 auto 10px">RG</div><h2 style="margin:0 0 4px;text-align:center">Créer votre compte</h2><p class="hint" style="text-align:center">Étape obligatoire : ce compte administrateur protège l'accès à l'application.</p>${inp("fRest","Nom du restaurant",db.settings.name)}${inp("fName","Votre nom",u.name==="Administrateur"?"":u.name)}${inp("fPw","Mot de passe (4 caractères minimum)","","password",'maxlength="30" autocomplete="new-password"')}${inp("fPw2","Confirmer le mot de passe","","password",'maxlength="30" autocomplete="new-password"')}<p class="hint">Notez bien ce mot de passe : il ne peut pas être récupéré. Faites aussi une sauvegarde régulière (Paramètres > Données).</p><button class="btn primary" style="width:100%;margin-top:6px" onclick="createAccount()">Créer mon compte et commencer</button><button class="btn light" style="width:100%;margin-top:8px" onclick="cloudSignIn(true)">☁ Se connecter à un compte cloud existant</button></section>`}
function createAccount(){let r=$("#fRest").value.trim(),n=$("#fName").value.trim(),p=$("#fPw").value;if(!r||!n)return toast("Renseignez le restaurant et votre nom.");if(p.length<4)return toast("Le mot de passe doit contenir au moins 4 caractères.");if(p!==$("#fPw2").value)return toast("Les mots de passe ne correspondent pas.");let u=db.users[0];u.name=n;u.pin=H(p);u.role="admin";u.perms=structuredClone(ROLES.admin);db.settings.name=r;db.settings.setup=true;save();applyBrand();enter(u);toast("Compte créé. Bienvenue !")}
function openUserMenu(){let u=curUser();modal("Session",`<p class="hint">Connecté : <b>${esc(u.name)}</b> — ${ROLES[u.role].label}</p><div class="toolbar"><button class="btn light" onclick="closeModal();setTab='me';setPage('settings')">⚙ Mes préférences</button><button class="btn light" onclick="closeModal();showLogin(false)">🔒 Verrouiller</button></div>`,"Changer d'utilisateur",()=>{closeModal();showLogin(true)})}
/* ---------- Préférences (par utilisateur) ---------- */
const setPref=(k,v)=>{curUser().prefs[k]=v;save();applyPrefs();render()};
const setSet=(k,v)=>{db.settings[k]=v;save();armLock();render()};
const seg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${String(curUser().prefs[k])===v?"on":""}" onclick="setPref('${k}','${v}')">${l}</button>`).join("")}</div>`;
const tog=(k,l)=>`<label class="tog"><input type="checkbox" ${curUser().prefs[k]?"checked":""} onchange="setPref('${k}',this.checked)"> ${l}</label>`;
const gtog=(k,l)=>`<label class="tog"><input type="checkbox" ${db.settings[k]?"checked":""} onchange="setSet('${k}',this.checked)"> ${l}</label>`;
const inp=(id,l,v,t="text",x="")=>`<div class="form-group"><label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${x}></div>`;
const sel=(id,l,v,o)=>`<div class="form-group"><label>${l}</label><select id="${id}">${o.map(([a,b])=>`<option value="${a}" ${String(v)===String(a)?"selected":""}>${b}</option>`).join("")}</select></div>`;
const pmList=()=>{let m=db.settings.methods.filter(x=>x.on).map(x=>x.name);if(db.settings.allowCredit)m.push(CREDIT);return m.length?m:["Espèces"]};
const TABS={
me(){let u=curUser(),p=u.prefs;return `<section class="setting-card"><h3>👤 Mon profil</h3>${inp("meName","Nom affiché",u.name)}<div class="form-group"><label>Couleur de l'avatar</label><div class="sw">${["#c8df75","#e6b85c","#8fd3ff","#f2b8a2","#d3b8ff","#9ae3b5"].map(c=>`<button style="background:${c}" class="${u.color===c?"on":""}" onclick="curUser().color='${c}';save();refreshChip();render()"></button>`).join("")}</div></div>
${u.pin?inp("mePin0","Mot de passe actuel (requis pour le modifier)","","password",'maxlength="30"'):""}${inp("mePin",u.pin?"Nouveau mot de passe (4 caractères minimum, laisser vide pour garder l'actuel)":"Mot de passe (4 caractères minimum)","","password",'inputmode="numeric" maxlength="30" autocomplete="off"')}<button class="btn primary" style="margin-top:12px" onclick="saveProfile()">Enregistrer le profil</button></section>
<section class="setting-card"><h3>🎨 Apparence</h3><div class="form-group"><label>Thème</label>${seg("theme",[["light","Clair"],["dark","Sombre"],["auto","Auto"]])}</div><div class="form-group"><label>Couleur de l'application</label><div class="sw">${Object.entries(PAL).map(([k,c])=>`<button title="${k}" style="background:linear-gradient(135deg,${c[0]} 50%,${c[2]} 50%)" class="${p.palette===k?"on":""}" onclick="setPref('palette','${k}')"></button>`).join("")}</div></div><div class="form-group"><label>Taille du texte</label>${seg("zoom",[["0.9","Petit"],["1","Normal"],["1.15","Grand"],["1.3","Très grand"]])}</div><div class="form-group"><label>Densité d'affichage</label>${seg("density",[["comfortable","Confortable"],["compact","Compact"]])}</div></section>
<section class="setting-card"><h3>🧭 Navigation & tableau de bord</h3><div class="form-group"><label>Page de démarrage</label><select onchange="setPref('start',this.value)">${ALLP.filter(can).map(k=>`<option value="${k}" ${p.start===k?"selected":""}>${PAGES[k]}</option>`).join("")}</select></div><label>Blocs affichés sur le tableau de bord</label>${tog("wChart","Graphique 7 jours")}${tog("wQuick","Actions rapides")}${tog("wSales","Dernières ventes")}${tog("wAlerts","Alertes de stock")}</section>
<section class="setting-card"><h3>🧾 Ma caisse</h3><div class="form-group"><label>Mode de paiement par défaut</label><select onchange="setPref('method',this.value)">${pmList().map(x=>`<option ${p.method===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div><div class="form-group"><label>Produits par ligne (écran large)</label>${seg("posCols",[["2","2"],["3","3"],["4","4"],["5","5"]])}</div>${tog("posEmoji","Afficher les icônes des produits")}${tog("posStock","Afficher le stock sur les produits")}<button class="btn light" style="margin-top:14px" onclick="if(confirm('Rétablir mes préférences par défaut ?')){curUser().prefs={...DEF_PREFS};save();applyPrefs();render()}">Rétablir mes préférences</button></section>`},
shop(){let s=db.settings;return `<section class="setting-card"><h3>🏪 Informations du restaurant</h3>${inp("sName","Nom du restaurant",s.name)}${inp("sPhone","Téléphone",s.phone)}${inp("sAddr","Adresse",s.address)}${inp("sLegal","Mentions légales (NIF, RCCM…) — affichées sur le ticket",s.legal)}<div class="form-group"><label>Logo</label><input id="setLogo" type="file" accept="image/*"></div>${s.logo?`<img class="logo-preview" src="${s.logo}"> <button class="mini" onclick="db.settings.logo='';applyBrand();render()">Retirer le logo</button>`:""}<div><button class="btn primary" style="margin-top:12px" onclick="saveFields()">Enregistrer</button></div></section>
<section class="setting-card"><h3>💱 Devise & affichage des montants</h3>${inp("sCur","Symbole / devise",s.currency)}${sel("sCurPos","Position",s.curPos,[["after","Après le montant (1 000 FCFA)"],["before","Avant le montant (FCFA 1 000)"]])}${sel("sDec","Décimales",s.decimals,[[0,"0 (1 000)"],[2,"2 (1 000,50)"]])}<button class="btn primary" onclick="saveFields()">Enregistrer</button></section>
<section class="setting-card"><h3>📦 Stock</h3>${inp("sThr","Seuil d'alerte par défaut (nouveaux produits)",s.defThreshold,"number",'min="0"')}${gtog("negStock","Autoriser la vente à stock épuisé")}${gtog("alertStock","M'alerter au démarrage si le stock est bas")}<button class="btn primary" style="margin-top:12px" onclick="saveFields()">Enregistrer</button></section>`},
pos(){let s=db.settings;return `<section class="setting-card"><h3>🧮 Taxe (TVA) & remises</h3>${sel("sTaxMode","Mode de calcul",s.taxMode,[["none","Aucune taxe"],["included","Taxe incluse dans les prix"],["added","Taxe ajoutée au total"]])}${inp("sTax","Taux de taxe (%)",s.tax,"number",'min="0" max="100" step="0.1"')}<p class="hint">Les remises maximales se règlent pour chaque utilisateur (onglet Utilisateurs).</p><button class="btn primary" onclick="saveFields()">Enregistrer</button></section>
<section class="setting-card"><h3>💳 Modes de paiement</h3>${s.methods.map((x,i)=>`<div class="mrow"><label class="tog"><input type="checkbox" ${x.on?"checked":""} onchange="db.settings.methods[${i}].on=this.checked;save();render()"> ${esc(x.name)}</label><button class="mini" onclick="delMethod(${i})">Supprimer</button></div>`).join("")}<div class="mrow"><input class="field" id="newMethod" placeholder="Nouveau mode (ex. Moov, Chèque)"><button class="btn light" onclick="addMethod()">Ajouter</button></div>${gtog("allowCredit","Autoriser la vente à crédit (dette)")}</section>
<section class="setting-card"><h3>🖨️ Ticket de caisse</h3>${inp("sFooter","Message de fin de ticket",s.footer)}${sel("sWidth","Largeur du papier",s.rWidth,[["80","80 mm"],["58","58 mm"]])}${gtog("rLogo","Afficher le logo")}${gtog("rCashier","Afficher le nom du caissier")}${gtog("autoPrint","Lancer l'impression automatiquement")}<button class="btn primary" style="margin-top:12px" onclick="saveFields()">Enregistrer</button></section>`},
users(){let s=db.settings;return `<section class="setting-card"><h3>🔐 Sécurité</h3>${sel("sLock","Verrouillage automatique après inactivité",s.lockMin,[[0,"Jamais"],[2,"2 minutes"],[5,"5 minutes"],[15,"15 minutes"],[30,"30 minutes"]])}<p class="hint">Chaque utilisateur doit avoir un mot de passe. Il protège l'accès sur cet appareil mais ne chiffre pas les données (voir À propos). Notez-le : il ne peut pas être récupéré.</p><button class="btn primary" onclick="saveFields()">Enregistrer</button></section>
<section class="setting-card wide"><div class="panel-head"><h3>👥 Utilisateurs & droits</h3><button class="btn primary" onclick="openUser()">＋ Ajouter</button></div><div class="table-wrap"><table class="data-table"><tr><th>Utilisateur</th><th>Rôle</th><th>Mot de passe</th><th>Pages</th><th>Remise max</th><th></th></tr>${db.users.map(u=>`<tr><td><span class="avatar" style="background:${u.color};color:#102a25;display:inline-grid">${esc(ini(u.name))}</span> <b>${esc(u.name)}</b>${u.id===uid?" (moi)":""}</td><td>${ROLES[u.role].label}</td><td>${u.pin?"Défini":"—"}</td><td>${u.perms.pages.length}/${ALLP.length}</td><td>${u.perms.maxDiscount}%</td><td><button class="mini" onclick="openUser(${u.id})">Modifier</button> <button class="mini" onclick="delUser(${u.id})">Supprimer</button></td></tr>`).join("")}</table></div></section>`},
data(){let s=db.settings;return `<section class="setting-card"><h3>💾 Sauvegarde & restauration</h3><p class="hint">Dernière sauvegarde : <b>${s.lastBackup||"jamais"}</b>. La sauvegarde contient ventes, produits, clients, utilisateurs et préférences.</p><button class="btn primary" onclick="backup()">Télécharger une sauvegarde JSON</button><div class="form-group" style="margin-top:20px"><label>Restaurer une sauvegarde JSON</label><input type="file" id="restoreFile" accept="application/json"></div><button class="btn light" onclick="restore()">Restaurer les données</button></section><section class="setting-card"><h3>⚠️ Zone sensible</h3><p class="hint">Efface ventes, produits, clients, utilisateurs et réglages de cet appareil.</p><button class="btn danger" onclick="resetData()">Réinitialiser toutes les données</button></section>`},
about(){return `<section class="setting-card"><h3>ℹ️ À propos</h3><p><b>${esc(db.settings.name)}</b> — version 1.5</p><p class="hint">Application intégrée à ZUMUYA GROUP : les données de cet établissement sont synchronisées avec Supabase et séparées des autres restaurants. Les rôles locaux servent à organiser le travail d'équipe sur cet appareil.</p></section><section class="setting-card"><h3>🔒 Confidentialité</h3><p class="hint">Les données professionnelles sont stockées dans le projet Supabase de ZUMUYA GROUP et protégées par les règles d'accès de l'établissement. Vous pouvez aussi exporter une sauvegarde depuis Paramètres > Données.</p><p class="hint"><a href="#" onclick="showPrivacy();return false">Politique de confidentialité complète</a></p></section>`}};
function settings(m){let t=[["me","Mon profil"],["shop","Restaurant"],["pos","Caisse & ticket"],["users","Utilisateurs"],["data","Données"],["cloud","Synchronisation"],["about","À propos"]].filter(([k])=>k==="me"||k==="about"||(k==="own"?(!!localStorage.rg_owner_priv&&isOwnerUser()):(k==="users"||k==="cloud")?curUser().role==="admin":can("config")));
if(!t.some(x=>x[0]===setTab))setTab="me";
m.innerHTML=head("Paramètres","Personnalisez l'application pour chaque utilisateur.")+`<div class="tabs">${t.map(([k,l])=>`<button class="${k===setTab?"on":""}" onclick="setTab='${k}';render()">${l}</button>`).join("")}</div><div class="settings-grid">${TABS[setTab]()}</div>`;
let f=$("#setLogo");if(f)f.onchange=e=>{let r=new FileReader(),x=e.target.files[0];if(!x)return;r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement("canvas"),k=Math.min(1,256/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);db.settings.logo=c.toDataURL("image/png");save();applyBrand();render()};im.src=r.result};r.readAsDataURL(x)}}
const FIELDS=[["sName","name"],["sPhone","phone"],["sAddr","address"],["sLegal","legal"],["sCur","currency"],["sCurPos","curPos"],["sDec","decimals",1],["sThr","defThreshold",1],["sTax","tax",1],["sTaxMode","taxMode"],["sFooter","footer"],["sWidth","rWidth"],["sLock","lockMin",1]];
function saveFields(){let s=db.settings,n=$("#sName"),c=$("#sCur"),t=$("#sTax");if(n&&!n.value.trim())return toast("Saisissez le nom du restaurant.");if(c&&!c.value.trim())return toast("Saisissez la devise.");if(t&&(+t.value<0||+t.value>100))return toast("Taux de taxe invalide.");
FIELDS.forEach(([i,k,num])=>{let e=document.getElementById(i);if(e)s[k]=num?(+e.value||0):e.value.trim()});save();armLock();applyBrand();render();toast("Paramètres enregistrés.")}
function saveProfile(){let u=curUser(),n=$("#meName").value.trim(),np=$("#mePin").value,rm=false;if(!n)return toast("Saisissez un nom.");
if((np||rm)&&u.pin&&H($("#mePin0").value)!==u.pin)return toast("Mot de passe actuel incorrect.");if(np&&np.length<4)return toast("Le mot de passe doit contenir au moins 4 caractères.");
if(db.users.some(x=>x.id!==u.id&&x.name.toLowerCase()===n.toLowerCase()))return toast("Ce nom existe déjà.");u.name=n;if(np)u.pin=H(np);save();refreshChip();render();toast("Profil enregistré.")}
function addMethod(){let n=$("#newMethod").value.trim(),l=db.settings.methods;if(!n||n===CREDIT||l.some(x=>x.name.toLowerCase()===n.toLowerCase()))return toast("Nom invalide ou déjà utilisé.");l.push({name:n,on:true});save();render()}
function delMethod(i){if(confirm("Supprimer ce mode de paiement ? Les anciennes ventes restent inchangées.")){db.settings.methods.splice(i,1);save();render()}}
function openUser(id){let u=db.users.find(x=>x.id===id)||mkUser("","cashier"),pm=u.perms;modal(id?"Modifier l'utilisateur":"Nouvel utilisateur",`<div class="form-grid">${inp("uName","Nom",u.name)}<div class="form-group"><label>Rôle (préréglage)</label><select id="uRole">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${u.role===k?"selected":""}>${r.label}</option>`).join("")}</select></div><div class="form-group"><label>Mot de passe (4 caractères min.)</label><input id="uPin" type="password" maxlength="30" placeholder="${u.pin?"Inchangé":"Obligatoire"}"></div>${inp("uDisc","Remise maximale (%)",pm.maxDiscount,"number",'min="0" max="100"')}</div><div class="form-group" style="margin-top:12px"><label>Pages autorisées</label><div class="chk">${ALLP.map(p=>`<label><input type="checkbox" class="uPage" value="${p}" ${pm.pages.includes(p)?"checked":""}> ${PAGES[p]}</label>`).join("")}</div></div><div class="form-group"><label>Autorisations</label><div class="chk">${[["delete","Supprimer des éléments"],["profit","Voir les bénéfices"],["config","Modifier les réglages"]].map(([k,l])=>`<label><input type="checkbox" class="uFlag" value="${k}" ${pm[k]?"checked":""}> ${l}</label>`).join("")}</div></div>`,"Enregistrer",()=>saveUser(u,!!id));
$("#uRole").onchange=e=>{let r=ROLES[e.target.value];document.querySelectorAll(".uPage").forEach(c=>c.checked=r.pages.includes(c.value));document.querySelectorAll(".uFlag").forEach(c=>c.checked=!!r[c.value]);$("#uDisc").value=r.maxDiscount}}
function saveUser(u,edit){let n=$("#uName").value.trim(),pin=$("#uPin").value,role=$("#uRole").value;if(!n)return toast("Saisissez un nom.");if(!edit&&!pin)return toast("Un mot de passe est obligatoire.");if(pin&&pin.length<4)return toast("Le mot de passe doit contenir au moins 4 caractères.");
if(db.users.some(x=>x.id!==u.id&&x.name.toLowerCase()===n.toLowerCase()))return toast("Ce nom existe déjà.");if(edit&&u.role==="admin"&&role!=="admin"&&db.users.filter(x=>x.role==="admin").length<2)return toast("Il faut au moins un administrateur.");

async function initZumuyaRestoGest(){

  KEY="zumuya_restogest_v1_"+ZORG.id;UKEY="zumuya_restogest_user_v1_"+ZORG.id;
