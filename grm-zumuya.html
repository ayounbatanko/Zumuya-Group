<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZUMUYA GRM</title><style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17233e;--mut:#69758d;--gold:#ffb703;--nav:#14213d;--bd:#dfe5ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,Segoe UI,sans-serif}header{background:var(--nav);color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}main{max-width:1200px;margin:auto;padding:18px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:white;position:sticky;top:0;z-index:3}button,.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--gold);font-weight:700;cursor:pointer}nav button{background:#e9eef7}nav button.active{background:var(--nav);color:white}.card{background:var(--card);padding:16px;border-radius:16px;border:1px solid var(--bd);margin:12px 0}input,select,textarea{padding:10px;border-radius:9px;border:1px solid var(--bd);font:inherit;width:100%;margin:5px 0}label{font-size:13px;color:var(--mut)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{font-size:27px;font-weight:800}.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.hide{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}.tablewrap{overflow:auto}.danger{background:#ffe4e4}.msg{padding:10px;border-radius:8px;background:#fff2cc;margin:8px 0} @media(max-width:600px){main{padding:10px}header{padding:12px}}
</style><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div><b>🟠 ZUMUYA GRM</b><div class="mut" style="color:#d9e3f4">Gestion restaurant & hôtel</div></div><div id="conn">Configuration / connexion</div></header><nav id="nav"></nav><main><section id="setup" class="card"><h2>Connexion & établissement</h2><div class="msg">Connectez-vous avec un compte Supabase. Les données sont isolées par établissement et protégées par RLS.</div><div class="row"><div><label>Email</label><input id="email" type="email" autocomplete="username"></div><div><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div><button onclick="login()">Connexion</button><button onclick="signup()">Créer le compte</button></div><hr><div class="row"><div><label>Nom établissement</label><input id="orgname" placeholder="Nom du restaurant ou hôtel"></div><div><label>Type</label><select id="orgkind"><option value="restaurant">Restaurant</option><option value="hotel">Restaurant hôtel</option></select></div><button onclick="createOrg()">Créer établissement</button></div><div class="row"><select id="orgselect" onchange="chooseOrg()"><option value="">Sélectionner établissement</option></select><button onclick="refreshAll()">Actualiser</button><button onclick="logout()">Déconnexion</button></div><div id="authmsg"></div></section><div id="content"></div></main><script src="grm-zumuya.js"></script></body></html>
