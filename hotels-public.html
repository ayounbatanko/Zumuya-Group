<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b45"><title>Hôtels partenaires — ZUMUYA GROUP</title><link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="stylesheet" href="zservice.css"><link rel="stylesheet" href="zcart.css">
<style>.hotel-list{display:grid;gap:14px}.hotel-card{background:#fff;border:1px solid #e1e7ee;border-radius:16px;padding:16px}.hotel-card h2{margin:0 0 6px}.hotel-card .mut{color:#65738a}.hotel-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}.hotel-dish{border:1px solid #e3e9f0;border-radius:12px;padding:10px}.hotel-dish img{width:100%;height:110px;object-fit:cover;border-radius:8px}.hotel-dish b{display:block}.hotel-dish .price{font-weight:800;color:#14213d;margin:5px 0}</style></head><body>
<header class="zbar"><a class="zbrand" href="index.html"><img src="logo.svg" alt=""><span>ZUMUYA <b>GROUP</b></span></a><nav><a href="index.html#services">Services</a><a href="restauration.html">Restaurants</a><a href="hotel.html">Espace hôtel</a><a href="compte.html" id="who">Se connecter</a></nav></header>
<section class="zhero"><span class="eyebrow">PÔLE 02 · HÔTELLERIE</span><h1>Les hôtels <em>partenaires</em></h1><p>Consultez librement les établissements, leurs services et leurs offres de restauration. Tous les comptes ZUMUYA peuvent commander.</p></section>
<main class="zwrap"><div class="zsearch"><input id="q" type="search" placeholder="Rechercher un hôtel, une ville ou un service…"><button id="refresh" class="btn btn-gold">Actualiser</button></div><div id="hotels" class="hotel-list">Chargement des catalogues…</div></main>
<script src="config.js"></script><script src="zsession.js"></script><script src="zcart.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),esc=ZS.esc;let hotels=[];
const w=ZS.who();if(w){$('#who').textContent='Mon compte';$('#who').href='compte.html'}
function render(){const q=$('#q').value.trim().toLowerCase();const list=hotels.filter(r=>!q||[r.name,r.address,r.hotel?.category,...(r.hotel?.services||[])].join(' ').toLowerCase().includes(q));
 $('#hotels').innerHTML=list.map(r=>{const h=r.hotel||{},menu=r.menu||[];return '<article class="hotel-card"><h2>🏨 '+esc(h.name||r.name)+'</h2><div class="mut">'+esc(h.category||'Hôtel')+' · '+esc(r.address||'Adresse non renseignée')+'</div><p>'+esc((h.services||[]).join(' · ')||'Services hôteliers')+'</p><p class="mut">'+(h.rooms?esc(h.rooms)+' chambres · ':'')+(h.hours?'Horaires : '+esc(h.hours):'')+'</p><div class="hotel-menu">'+menu.map((p,i)=>'<div class="hotel-dish">'+(p.imgs&&p.imgs[0]?'<img loading="lazy" src="'+esc(p.imgs[0])+'" alt="">':'')+'<b>'+esc(p.n)+'</b><div class="price">'+ZS.money(p.p,r.currency)+'</div>'+ZC.ctl(r.id,i,p.n)+'</div>').join('')+'</div></article>'}).join('')||'<article class="hotel-card">Aucun catalogue hôtelier public disponible pour le moment.</article>';
 ZC.setData(hotels,null)}
async function load(){try{const a=await ZS.rests();hotels=a.filter(r=>ZS.subOk(r)&&ZS.isHotel(r));render()}catch(e){$('#hotels').textContent='Impossible de charger les catalogues hôteliers. Réessayez.'}}
$('#q').addEventListener('input',render);$('#refresh').addEventListener('click',load);ZC.init({onChange:render});load();setInterval(load,60000);
})();
</script><script src="account-shortcuts.js"></script></body></html>
