<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b45"><link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="zservice.css?v=1"><title>ZUMUYA Livraison — service de livraison coordonné</title></head><body>
<header class="zbar"><a class="zbrand" href="index.html"><img src="logo.svg" alt=""><span>ZUMUYA <b>GROUP</b></span></a>
<nav><a href="index.html#services">Services</a><a href="restauration.html">Restauration</a><a href="hotel.html">Hôtel</a><a id="who" href="compte.html">Se connecter</a></nav></header>
<section class="zhero"><span class="eyebrow">PÔLE 03 · LOGISTIQUE</span><h1>ZUMUYA <em>Livraison</em></h1><p>Un service à part, en coordination avec ZUMUYA Restauration et ZUMUYA Hôtel : la course est proposée au livreur libre le plus proche, suivie en direct jusqu’à la remise.</p></section>
<main class="zwrap" id="app"></main>
<script src="config.js"></script><script src="zsession.js?v=1"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),esc=ZS.esc,who=ZS.resto(),pw=ZS.portal(),w=who||pw;
if(w){const a=$('#who');a.textContent='Connecté';a.className='zpill';a.href=who?'resto-index.html':'compte.html'}
const FLOW='<div class="flow"><div class="card step"><i>ÉTAPE 01</i><b>🍽️ Restauration / 🏨 Hôtel</b><span>Le restaurant ou l’hôtel accepte et prépare la commande.</span></div><div class="card step"><i>ÉTAPE 02</i><b>📡 Offre automatique</b><span>Le serveur propose la course au livreur libre le plus proche (90 s, puis au suivant).</span></div><div class="card step"><i>ÉTAPE 03</i><b>🛵 En route</b><span>Le livreur partage sa position ; le client suit la course sur la carte.</span></div><div class="card step"><i>ÉTAPE 04</i><b>✅ Remise</b><span>Confirmation de réception et clôture de la commande.</span></div></div>';
let role='';
if(who&&who.role==='driver')role='<div class="card lock"><h2>Espace livreur</h2><p>Bonjour '+esc(who.name)+'. Ouvrez vos courses, acceptez les offres et publiez votre position.</p><a class="btn btn-gold" href="resto-driver.html">Ouvrir mes courses →</a></div>';
else if(who&&(who.role==='restaurant')&&who.rest)role='<div id="board"></div>';
else role='<div class="card lock"><span class="eyebrow" style="color:#0b7d6f">ACCÈS PAR RÔLE</span><h2>Livreurs, restaurants et hôtels</h2><p>Les livreurs ouvrent leurs courses ; les restaurants et les hôtels suivent leurs livraisons. Les comptes livreurs sont créés par le restaurant ou l’hôtel partenaire.</p><a class="btn btn-gold" href="resto-index.html">Me connecter</a><a class="btn btn-line" href="restauration.html">Voir les restaurants</a></div>';
$('#app').innerHTML='<div class="kpis" id="net"></div><div class="sec-title"><h2>Comment fonctionne la coordination</h2></div>'+FLOW+role;
async function load(){try{const [rs,os]=await Promise.all([ZS.rests(),ZS.orders()]);
 const del=os.filter(o=>o.deliveryMode!=='room'),run=del.filter(o=>['colis récupéré','en route','arrivé'].includes(o.status)),wait=del.filter(o=>['acceptée','préparée'].includes(o.status)&&!o.driverId),ok=del.filter(o=>o.status==='terminée');
 $('#net').innerHTML=[['Restaurants partenaires',rs.filter(r=>ZS.subOk(r)&&!ZS.isHotel(r)).length],['Hôtels partenaires',rs.filter(r=>ZS.subOk(r)&&ZS.isHotel(r)).length],['En attente de livreur',wait.length],['Livraisons en cours',run.length],['Livraisons terminées',ok.length]].map(x=>'<div class="card kpi"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');
 if(who&&who.rest&&$('#board')){const mine=del.filter(o=>o.restId===who.rest.id),cur=who.rest;
  const g=(l,a)=>'<div class="card kpi"><small>'+l+'</small><strong>'+a.length+'</strong></div>';
  $('#board').innerHTML='<div class="sec-title"><h2>Mes livraisons — '+esc(cur.name)+'</h2><span style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-line" href="resto-restaurant.html#orders">Mes commandes</a><a class="btn btn-line" href="resto-restaurant.html#drivers">Mes livreurs</a></span></div><div class="kpis">'+g('En attente de livreur',mine.filter(o=>['acceptée','préparée'].includes(o.status)&&!o.driverId))+g('En route',mine.filter(o=>['colis récupéré','en route','arrivé'].includes(o.status)))+g('Terminées',mine.filter(o=>o.status==='terminée'))+'</div>'+
  '<div class="card tw"><table class="table"><thead><tr><th>Réf.</th><th>Distance</th><th>Livraison</th><th>Total</th><th>Livreur</th><th>Statut</th></tr></thead><tbody>'+(mine.slice(0,15).map(o=>'<tr><td>#'+esc(o.id)+'</td><td>'+(o.distKm!=null?o.distKm+' km':'—')+'</td><td>'+ZS.money(o.deliveryFee||0,cur.currency)+'</td><td>'+ZS.money(o.total,cur.currency)+'</td><td>'+esc(o.driverName||(o.driverId?'Attribué':'—'))+'</td><td><span class="badge grey">'+esc(o.status)+'</span></td></tr>').join('')||'<tr><td colspan="6">Aucune livraison pour le moment.</td></tr>')+'</tbody></table></div>'}
 }catch(e){$('#net').innerHTML='<div class="msgbar" style="grid-column:1/-1">Statistiques indisponibles pour le moment.</div>'}}
load();setInterval(load,30000);
})();
</script></body></html>
