<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b45"><title>Messagerie — ZUMUYA GROUP"><link rel="stylesheet" href="styles.css"><style>
:root{--navy:#102b45;--gold:#c59a42}.chat-wrap{max-width:1180px;margin:20px auto;padding:0 16px 28px}.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.chat-layout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;margin-top:18px;align-items:stretch}.chat-card{background:#fff;border:1px solid #dce4eb;border-radius:20px;padding:18px;min-width:0;box-shadow:0 12px 34px #102b4510}.chat-list{display:grid;gap:8px;max-height:65vh;overflow:auto}.chat-thread{width:100%;text-align:left;border:1px solid #e2e8ef;background:#fff;border-radius:12px;padding:12px;cursor:pointer;color:#102b45}.chat-thread.active{border-color:var(--gold);background:#fffaf0}.chat-thread small{display:block;color:#657587;margin-top:4px}.chat-messages{height:min(62vh,680px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px;background:#f4f7fa;border-radius:12px}.chat-bubble{max-width:82%;padding:10px 13px;border-radius:14px;background:#fff;border:1px solid #e1e7ed;overflow-wrap:anywhere}.chat-bubble.mine{align-self:flex-end;background:#102b45;color:#fff;border-color:#102b45}.chat-bubble small{display:block;opacity:.7;font-size:.72rem;margin-top:4px}.chat-send{display:flex;gap:8px;margin-top:10px}.chat-send textarea{flex:1;min-width:0;resize:vertical;border:1px solid #ccd5df;border-radius:10px;padding:10px;font:inherit}.chat-send button,.chat-action{border:0;border-radius:10px;padding:11px 15px;background:#102b45;color:white;font-weight:800;cursor:pointer}.chat-note{color:#657587;font-size:.9rem}.chat-empty{padding:30px 10px;text-align:center;color:#657587}.chat-head{padding:16px 18px;border-radius:18px;background:linear-gradient(120deg,#102b45,#1c4867);color:#fff}.chat-head .eyebrow{color:#65e2d2}.chat-head h1{margin:4px 0}.chat-head .chat-note{color:#d1e0e8}.chat-action{display:inline-flex;text-decoration:none;align-items:center}.chat-list{max-height:36vh}.chat-send{position:sticky;bottom:0;background:#fff;padding-top:8px}.chat-send button{min-width:110px}.chat-card h2,.chat-card h3{color:#102b45}
@media(max-width:700px){.chat-wrap{margin:10px auto;padding:0 10px 18px}.chat-layout{grid-template-columns:1fr}.chat-card{padding:13px}.chat-list{max-height:24vh}.chat-messages{height:42vh;min-height:260px}.chat-head{align-items:flex-start}.chat-action{width:100%;justify-content:center}}
</style></head><body><main class="chat-wrap"><header class="chat-head"><div><p class="eyebrow">ZUMUYA GROUP</p><h1>💬 Messagerie</h1><p class="chat-note">Échangez directement avec les clients, producteurs, commerçants et partenaires.</p></div><a class="chat-action" href="javascript:history.back()">← Retour à mon espace</a></header><div id="chatStatus" class="chat-note" role="status">Connexion à la messagerie…</div><section class="chat-layout"><aside class="chat-card"><h2>Conversations</h2><div id="chatThreads" class="chat-list"><p class="chat-empty">Chargement…</p></div><h3>Acteurs à contacter</h3><input id="actorSearch" type="search" placeholder="Rechercher un vendeur / partenaire"><div id="chatDirectory" class="chat-list"><p class="chat-empty">Chargement des partenaires…</p></div></aside><section class="chat-card"><div id="chatTitle"><h2>Vos messages</h2><p class="chat-note">Sélectionnez une conversation pour commencer.</p></div><div id="chatMessages" class="chat-messages"><p class="chat-empty">Aucune conversation sélectionnée.</p></div><form id="chatSend" class="chat-send"><textarea id="chatBody" rows="2" maxlength="4000" placeholder="Écrivez votre message…" required disabled></textarea><button type="submit" disabled>Envoyer</button></form></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="messagerie.js"></script></body></html>
